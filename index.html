<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encrypted 2FA Vault</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      margin-bottom: 1.5rem;
    }

    h1, h2 {
      margin-bottom: 1rem;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      background-color: var(--primary);
      color: white;
      transition: background-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    button:hover { background-color: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.btn-danger { background-color: var(--danger); }
    button.btn-danger:hover { background-color: var(--danger-hover); }
    button.btn-secondary { background-color: var(--border); }
    button.btn-secondary:hover { background-color: #475569; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.5rem;
    }

    .account-item {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .account-info {
      display: flex;
      flex-direction: column;
    }

    .account-name { font-weight: 600; font-size: 1rem; }
    .account-issuer { font-size: 0.8rem; color: var(--text-muted); }
    .account-key { 
      font-family: monospace; 
      color: var(--success); 
      margin-top: 0.25rem; 
      letter-spacing: 1px;
      font-size: 0.9rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- LOGIN / SETUP VIEW -->
    <div id="authCard" class="card">
      <h2>Vault Access</h2>
      <div class="form-group">
        <label for="githubUser">GitHub Username</label>
        <input type="text" id="githubUser" placeholder="octocat" />
      </div>
      <div class="form-group">
        <label for="githubRepo">GitHub Repository</label>
        <input type="text" id="githubRepo" placeholder="my-vault" />
      </div>
      <div class="form-group">
        <label for="githubToken">GitHub PAT Token</label>
        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" />
      </div>
      <div class="form-group">
        <label for="masterPassword">Master Password</label>
        <input type="password" id="masterPassword" placeholder="••••••••••••" />
      </div>
      <button id="unlockBtn" onclick="unlockVault()">🔓 Unlock Vault</button>
    </div>

    <!-- MAIN DASHBOARD VIEW -->
    <div id="dashboard" class="card hidden">
      
      <!-- ACTION TOOLBAR -->
      <div class="toolbar">
        <div class="btn-group">
          <button onclick="toggleAddModal()">+ Add Account</button>
          
          <!-- 🔄 REFRESH SYNC BUTTON -->
          <button id="refreshBtn" class="btn-secondary" onclick="refreshVault()" title="Pull latest state from GitHub">
            🔄 Refresh Sync
          </button>
        </div>
        
        <button class="btn-danger" onclick="lockVault()">🔒 Lock</button>
      </div>

      <!-- ADD ACCOUNT FORM -->
      <div id="addAccountForm" class="card hidden" style="background-color: var(--bg); margin-top: 1rem;">
        <h2>Add 2FA Key</h2>
        <div class="form-group">
          <label for="newIssuer">Service / Issuer</label>
          <input type="text" id="newIssuer" placeholder="Google, GitHub, etc." />
        </div>
        <div class="form-group">
          <label for="newAccount">Account Name / Email</label>
          <input type="text" id="newAccount" placeholder="user@example.com" />
        </div>
        <div class="form-group">
          <label for="newSecret">Secret / Setup Key</label>
          <input type="text" id="newSecret" placeholder="JBSWY3DPEHPK3PXP" />
        </div>
        <div class="btn-group">
          <button onclick="addAccount()">Save Account</button>
          <button class="btn-secondary" onclick="toggleAddModal()">Cancel</button>
        </div>
      </div>

      <!-- ACCOUNTS LIST -->
      <h2>Your 2FA Keys</h2>
      <div id="accountsList">
        <!-- Accounts will render dynamically here -->
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // GLOBAL STATE
    // ==========================================
    let masterKey = null;         // CryptoKey derived via PBKDF2
    let currentSha = null;        // GitHub file SHA for conflict prevention
    let accounts = [];            // Decrypted accounts list
    let GITHUB_USER = "";
    let GITHUB_REPO = "";
    let userGithubToken = "";

    const SALT_STRING = "static_vault_salt_2026"; // PBKDF2 Salt
    const CANARY_PHRASE = "VAULT_VALID_CANARY";

    // ==========================================
    // CRYPTOGRAPHY HELPERS (AES-GCM + PBKDF2)
    // ==========================================

    // Derive AES key from password using PBKDF2
    async function deriveKey(password) {
      const encoder = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        'raw', 
        encoder.encode(password), 
        { name: 'PBKDF2' }, 
        false, 
        ['deriveKey']
      );

      return crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: encoder.encode(SALT_STRING),
          iterations: 150000,
          hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    // Encrypt string data to Base64 (IV + Ciphertext)
    async function encryptData(plainText, key) {
      const encoder = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        encoder.encode(plainText)
      );

      // Combine IV and Ciphertext
      const combined = new Uint8Array(iv.length + encrypted.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(encrypted), iv.length);

      return btoa(String.fromCharCode(...combined));
    }

    // Decrypt Base64 encrypted payload
    async function decryptData(encryptedBase64, key) {
      const binaryString = atob(encryptedBase64);
      const combined = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        combined[i] = binaryString.charCodeAt(i);
      }

      const iv = combined.slice(0, 12);
      const ciphertext = combined.slice(12);

      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        ciphertext
      );

      return new TextDecoder().decode(decrypted);
    }

    // ==========================================
    // VAULT CORE LOGIC & GITHUB SYNC
    // ==========================================

    async function unlockVault() {
      GITHUB_USER = document.getElementById('githubUser').value.trim();
      GITHUB_REPO = document.getElementById('githubRepo').value.trim();
      userGithubToken = document.getElementById('githubToken').value.trim();
      const password = document.getElementById('masterPassword').value;

      if (!GITHUB_USER || !GITHUB_REPO || !userGithubToken || !password) {
        alert("Please fill in all setup fields.");
        return;
      }

      const unlockBtn = document.getElementById('unlockBtn');
      unlockBtn.disabled = true;
      unlockBtn.innerText = "Deriving Key & Fetching...";

      try {
        masterKey = await deriveKey(password);

        // Fetch existing vault file from GitHub
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/vault.json?t=${Date.now()}`;
        const response = await fetch(url, {
          headers: {
            'Authorization': `token ${userGithubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (response.status === 404) {
          // Vault does not exist yet; initialize empty vault
          accounts = [];
          await saveVaultToGithub();
        } else if (response.ok) {
          const data = await response.json();
          currentSha = data.sha;

          const rawContent = decodeURIComponent(escape(atob(data.content)));
          const vaultData = JSON.parse(rawContent);

          // Test password validity with canary
          const canary = await decryptData(vaultData.canary, masterKey);
          if (canary !== CANARY_PHRASE) {
            throw new Error("Invalid password");
          }

          // Decrypt account secrets
          const decryptedAccountsStr = await decryptData(vaultData.accounts, masterKey);
          accounts = JSON.parse(decryptedAccountsStr);
        } else {
          throw new Error(`GitHub API Error: ${response.statusText}`);
        }

        // Display dashboard
        document.getElementById('authCard').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        renderAccounts();

      } catch (err) {
        console.error(err);
        alert("Failed to unlock vault. Check your credentials or password.");
      } finally {
        unlockBtn.disabled = false;
        unlockBtn.innerText = "🔓 Unlock Vault";
      }
    }

    // Save/Push changes to GitHub vault.json
    async function saveVaultToGithub() {
      const canaryEncrypted = await encryptData(CANARY_PHRASE, masterKey);
      const accountsEncrypted = await encryptData(JSON.stringify(accounts), masterKey);

      const vaultPayload = {
        canary: canaryEncrypted,
        accounts: accountsEncrypted
      };

      const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(vaultPayload, null, 2))));

      const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/vault.json`;
      const bodyData = {
        message: "Update 2FA vault",
        content: contentBase64
      };

      if (currentSha) {
        bodyData.sha = currentSha;
      }

      const response = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${userGithubToken}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(bodyData)
      });

      if (!response.ok) {
        throw new Error(`Failed to save to GitHub: ${response.statusText}`);
      }

      const result = await response.json();
      currentSha = result.content.sha;
    }

    // 🔄 REFRESH / PULL LATEST VAULT STATE FROM GITHUB
    async function refreshVault() {
      const refreshBtn = document.getElementById('refreshBtn');

      if (!masterKey) {
        alert('Please unlock your vault first.');
        return;
      }

      if (refreshBtn) {
        refreshBtn.disabled = true;
        refreshBtn.innerText = '🔄 Syncing...';
      }

      try {
        // Cache-buster query parameter (?t=...) forces a fresh fetch from GitHub
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/vault.json?t=${Date.now()}`;
        const response = await fetch(url, {
          headers: {
            'Authorization': `token ${userGithubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) {
          throw new Error(`Failed to fetch from GitHub (Status: ${response.status})`);
        }

        const data = await response.json();

        // Base64 decode raw file payload
        const rawContent = decodeURIComponent(escape(atob(data.content)));
        const vaultData = JSON.parse(rawContent);

        // Decrypt accounts using current master key
        const decryptedAccountsStr = await decryptData(vaultData.accounts, masterKey);
        
        // Update local memory
        accounts = JSON.parse(decryptedAccountsStr);

        // Update active file SHA to avoid future write conflicts
        currentSha = data.sha;

        // Update UI
        renderAccounts();

      } catch (error) {
        console.error('Refresh Error:', error);
        alert('Failed to refresh vault: ' + error.message);
      } finally {
        if (refreshBtn) {
          refreshBtn.disabled = false;
          refreshBtn.innerText = '🔄 Refresh Sync';
        }
      }
    }

    // ==========================================
    // UI HANDLERS
    // ==========================================

    function renderAccounts() {
      const listContainer = document.getElementById('accountsList');
      listContainer.innerHTML = '';

      if (accounts.length === 0) {
        listContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center; margin-top: 1rem;">No 2FA keys stored yet.</p>`;
        return;
      }

      accounts.forEach((acc, index) => {
        const item = document.createElement('div');
        item.className = 'account-item';
        item.innerHTML = `
          <div class="account-info">
            <span class="account-name">${acc.issuer || 'Account'}</span>
            <span class="account-issuer">${acc.account}</span>
            <span class="account-key">${acc.secret}</span>
          </div>
          <button class="btn-danger" onclick="deleteAccount(${index})">Delete</button>
        `;
        listContainer.appendChild(item);
      });
    }

    async function addAccount() {
      const issuer = document.getElementById('newIssuer').value.trim();
      const account = document.getElementById('newAccount').value.trim();
      const secret = document.getElementById('newSecret').value.trim().replace(/\s+/g, '');

      if (!account || !secret) {
        alert('Please provide at least an account name and a setup key.');
        return;
      }

      accounts.push({ issuer, account, secret });

      try {
        await saveVaultToGithub();
        renderAccounts();
        toggleAddModal();
        
        // Clear input fields
        document.getElementById('newIssuer').value = '';
        document.getElementById('newAccount').value = '';
        document.getElementById('newSecret').value = '';
      } catch (err) {
        alert("Failed to update vault on GitHub: " + err.message);
        accounts.pop(); // Rollback local change if remote save fails
      }
    }

    async function deleteAccount(index) {
      if (!confirm("Are you sure you want to delete this key?")) return;

      const removed = accounts.splice(index, 1);

      try {
        await saveVaultToGithub();
        renderAccounts();
      } catch (err) {
        alert("Failed to update vault on GitHub: " + err.message);
        accounts.splice(index, 0, removed[0]); // Rollback on failure
      }
    }

    function toggleAddModal() {
      const form = document.getElementById('addAccountForm');
      form.classList.toggle('hidden');
    }

    function lockVault() {
      masterKey = null;
      currentSha = null;
      accounts = [];
      document.getElementById('masterPassword').value = '';
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('authCard').classList.remove('hidden');
    }
  </script>
</body>
</html>
