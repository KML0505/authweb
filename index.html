<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b; --surface: #17171a; --surface-hover: #1e1e22; --border: #2a2a2e;
    --text: #f0efec; --text-dim: #85858c; --accent: #e8a33d; --danger: #c2665f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 48px 20px 80px; }
  header h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0; font-size: 13px; color: var(--text-dim); line-height: 1.5; max-width: 38ch; }

  #lock-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lock-box { width: 100%; max-width: 340px; text-align: center; }
  .lock-icon { width: 40px; height: 40px; margin: 0 auto 20px; border: 1.5px solid var(--text-dim); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .lock-icon svg { width: 18px; height: 18px; stroke: var(--text-dim); }
  .lock-box h2 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  .lock-box .sub { font-size: 12.5px; color: var(--text-dim); margin: 0 0 20px; line-height: 1.5; }
  .lock-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; color: var(--text); font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; text-align: center; letter-spacing: 0.1em; margin-bottom: 8px;
  }
  .lock-box input:focus { outline: none; border-color: var(--accent); }
  .lock-box button.primary {
    width: 100%; margin-top: 6px; background: var(--accent); color: #1a1206;
    border: none; border-radius: 8px; padding: 11px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .lock-box button.primary:disabled { opacity: 0.5; cursor: default; }
  .lock-error { font-size: 12px; color: var(--danger); margin-top: 10px; min-height: 16px; }
  .lock-status { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; min-height: 14px; }
  .lock-reset { display: block; margin: 18px auto 0; font-size: 11.5px; color: var(--text-dim); text-decoration: underline; cursor: pointer; background: none; border: none; font-family: inherit; }
  #app { display: none; }

  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  #lock-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 7px; padding: 6px 10px; font-size: 11px; font-family: inherit; cursor: pointer; flex-shrink: 0; margin-left: 12px; }
  #lock-btn:hover { color: var(--text); }
  .sync-status { font-size: 11px; color: var(--text-dim); margin-bottom: 22px; display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .sync-dot.ok { background: #7ec98f; }
  .sync-dot.err { background: var(--danger); }
  .sync-dot.busy { background: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 16px 15px; margin-bottom: 10px; position: relative; border-left: 3px solid var(--stripe, var(--border)); }
  .card:hover { background: var(--surface-hover); }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 2px; }
  .service-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .account-label { font-size: 11.5px; color: var(--text-dim); opacity: 0.75; text-align: right; }
  .code-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .code { font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 500; letter-spacing: 0.06em; cursor: pointer; user-select: all; }
  .code:active { opacity: 0.7; }
  .ring-wrap { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 3; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .card-actions { display: flex; gap: 14px; margin-top: 8px; }
  .card-actions button { background: none; border: none; color: var(--text-dim); font-size: 11.5px; font-family: inherit; cursor: pointer; padding: 0; }
  .card-actions button:hover { color: var(--text); }
  .copied-tag { font-size: 11px; color: var(--accent); margin-left: 4px; opacity: 0; transition: opacity 0.2s ease; }
  .copied-tag.show { opacity: 1; }

  .add-card { border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-dim); background: none; width: 100%; font-family: inherit; font-size: 13px; margin-top: 4px; }
  .add-card:hover { border-color: var(--accent); color: var(--text); }
  .add-icon { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .add-icon svg { width: 12px; height: 12px; stroke: currentColor; }

  .add-form { margin-top: 4px; }
  .add-form input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 11px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 8px;
  }
  .add-form input:focus { outline: none; border-color: var(--accent); }
  .add-form-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-form-row button { background: var(--accent); color: #1a1206; border: none; border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .add-form-row button.secondary { background: none; border: 1px solid var(--border); color: var(--text-dim); }
  .add-form-row button:disabled { opacity: 0.5; cursor: default; }
  .error-msg { font-size: 11px; color: var(--danger); margin-top: 6px; }
  .hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; opacity: 0.8; line-height: 1.4; }
  .empty-msg { font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.5; }

  footer { margin-top: 30px; font-size: 11px; color: var(--text-dim); line-height: 1.6; opacity: 0.75; }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="10" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      </svg>
    </div>
    <h2 id="lock-title">Set a password</h2>
    <p class="sub" id="lock-sub">Checking for an existing vault...</p>
    <input type="password" id="lock-input" placeholder="Master Password" autocomplete="off" />
    <input type="password" id="lock-token-input" placeholder="GitHub Personal Access Token" autocomplete="off" style="display:none;" />
    <button class="primary" id="lock-submit">Continue</button>
    <div class="lock-error" id="lock-error"></div>
    <div class="lock-status" id="lock-status"></div>
    <button class="lock-reset" id="lock-reset">Reset local cache</button>
  </div>
</div>

<div id="app">
<div class="wrap">
  <div class="top-row">
    <header>
      <h1>Codes</h1>
      <p>Generated right here in the browser. Setup keys are encrypted before being saved.</p>
    </header>
    <button id="lock-btn">Lock</button>
  </div>
  <div class="sync-status" id="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Not synced</span></div>

  <div id="cards"></div>

  <button class="add-card" id="add-account-btn">
    <span class="add-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    Add account
  </button>

  <footer>
    Codes regenerate every 30 seconds. Setup keys and tokens are encrypted with AES-GCM before syncing to GitHub.
  </footer>
</div>
</div>

<script>
/* ===================== Config ===================== */
const GH_OWNER = 'kml0505';
const GH_REPO = 'authweb';
const GH_BRANCH = 'main';
const VAULT_PATH = 'vault.json';
const RAW_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${VAULT_PATH}`;
const API_URL = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${VAULT_PATH}`;

const LOCAL_VAULT_KEY = 'otp-vault-cache';
const CANARY_PLAINTEXT = 'otp-app-canary-v1';

let cryptoKey = null;
let ghToken = null; // Decrypted from vault or entered at setup
let currentSha = null;
let accounts = [];
let showingAddForm = false;

/* ===================== Crypto helpers ===================== */
function bufToB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer; }

async function deriveKey(password, saltB64) {
  const salt = b64ToBuf(saltB64);
  const enc = new TextEncoder().encode(password);
  const baseKey = await crypto.subtle.importKey('raw', enc, 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function encryptString(key, plaintext) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder().encode(plaintext);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc);
  return bufToB64(iv) + '.' + bufToB64(ct);
}
async function decryptString(key, packed) {
  if (!packed) return '';
  const [ivB64, ctB64] = packed.split('.');
  const iv = new Uint8Array(b64ToBuf(ivB64));
  const ct = b64ToBuf(ctB64);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(plainBuf);
}

/* ===================== Vault fetch/save ===================== */
async function fetchRemoteVault() {
  try {
    const res = await fetch(RAW_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function fetchRemoteMeta(token) {
  try {
    const res = await fetch(API_URL + `?ref=${GH_BRANCH}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {}
    });
    if (res.status === 404) return { exists: false, sha: null };
    if (!res.ok) throw new Error('meta fetch failed');
    const data = await res.json();
    return { exists: true, sha: data.sha };
  } catch (e) {
    return { exists: false, sha: null, error: true };
  }
}

async function pushVaultToGithub(vaultObj, token) {
  const meta = await fetchRemoteMeta(token);
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(vaultObj, null, 2))));
  const body = {
    message: 'Update OTP vault',
    content,
    branch: GH_BRANCH,
  };
  if (meta.sha) body.sha = meta.sha;
  const res = await fetch(API_URL, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || 'GitHub save failed');
  }
  const result = await res.json();
  currentSha = result.content ? result.content.sha : null;
  return true;
}

function cacheVaultLocally(vaultObj) {
  try { localStorage.setItem(LOCAL_VAULT_KEY, JSON.stringify(vaultObj)); } catch (e) {}
}
function loadCachedVault() {
  try {
    const raw = localStorage.getItem(LOCAL_VAULT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

async function saveAccountsAndSync() {
  const json = JSON.stringify(accounts);
  const accountsEnc = await encryptString(cryptoKey, json);
  const tokenEnc = ghToken ? await encryptString(cryptoKey, ghToken) : '';
  const vaultObj = { salt: currentSalt, canary: currentCanary, token: tokenEnc, accounts: accountsEnc };
  
  cacheVaultLocally(vaultObj);
  setSyncStatus('busy', 'Saving...');
  if (!ghToken) {
    setSyncStatus('err', 'Saved locally only (No GitHub token set)');
    return;
  }
  try {
    await pushVaultToGithub(vaultObj, ghToken);
    setSyncStatus('ok', 'Synced across all devices');
  } catch (e) {
    setSyncStatus('err', 'GitHub sync failed — saved on this device only');
  }
}

function setSyncStatus(state, text) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (!dot) return;
  dot.className = 'sync-dot' + (state ? ' ' + state : '');
  txt.textContent = text;
}

/* ===================== Lock screen flow ===================== */
let currentSalt = null;
let currentCanary = null;

async function initLockScreen() {
  const titleEl = document.getElementById('lock-title');
  const subEl = document.getElementById('lock-sub');
  const input = document.getElementById('lock-input');
  const tokenInput = document.getElementById('lock-token-input');
  const submitBtn = document.getElementById('lock-submit');
  const errorEl = document.getElementById('lock-error');
  const statusEl = document.getElementById('lock-status');
  const resetBtn = document.getElementById('lock-reset');

  errorEl.textContent = '';
  statusEl.textContent = 'Checking for existing vault on GitHub...';
  input.value = '';
  tokenInput.value = '';
  submitBtn.disabled = true;

  let vault = await fetchRemoteVault();
  let fromRemote = !!vault;
  if (!vault) vault = loadCachedVault();

  submitBtn.disabled = false;
  const isFirstTime = !vault;

  if (isFirstTime) {
    titleEl.textContent = 'Create Master Password';
    subEl.textContent = "No vault found. Set a master password and paste your GitHub token to start.";
    statusEl.textContent = '';
    tokenInput.style.display = 'block';
    resetBtn.style.display = 'none';
  } else {
    titleEl.textContent = 'Enter Password';
    subEl.textContent = 'Unlock to view and sync your 2FA codes.';
    statusEl.textContent = fromRemote ? 'Vault loaded from GitHub.' : 'Using local vault (GitHub unreachable).';
    tokenInput.style.display = 'none';
    resetBtn.style.display = 'inline-block';
  }

  async function submit() {
    const val = input.value;
    if (!val) return;
    submitBtn.disabled = true;
    try {
      if (isFirstTime) {
        const tokenVal = tokenInput.value.trim();
        if (!tokenVal) throw new Error('Please enter a GitHub access token.');
        
        const salt = crypto.getRandomValues(new Uint8Array(16));
        currentSalt = bufToB64(salt);
        cryptoKey = await deriveKey(val, currentSalt);
        currentCanary = await encryptString(cryptoKey, CANARY_PLAINTEXT);
        ghToken = tokenVal;
        accounts = [];

        await saveAccountsAndSync();
        unlock();
      } else {
        currentSalt = vault.salt;
        currentCanary = vault.canary;
        const key = await deriveKey(val, currentSalt);
        const check = await decryptString(key, currentCanary);
        if (check !== CANARY_PLAINTEXT) throw new Error('mismatch');
        
        cryptoKey = key;
        const json = await decryptString(cryptoKey, vault.accounts);
        accounts = JSON.parse(json);
        
        if (vault.token) {
          ghToken = await decryptString(cryptoKey, vault.token);
        }
        
        cacheVaultLocally(vault);
        unlock();
      }
    } catch (e) {
      errorEl.textContent = e.message === 'mismatch' ? 'Wrong password.' : e.message;
      input.value = '';
      input.focus();
    }
    submitBtn.disabled = false;
  }

  submitBtn.onclick = submit;
  input.onkeydown = e => { if (e.key === 'Enter') submit(); };
  tokenInput.onkeydown = e => { if (e.key === 'Enter') submit(); };
  
  resetBtn.onclick = () => {
    if (confirm('Clear local cache on this device?')) {
      try { localStorage.removeItem(LOCAL_VAULT_KEY); } catch (e) {}
      initLockScreen();
    }
  };

  input.focus();
}

function unlock() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  setSyncStatus(ghToken ? 'ok' : 'err', ghToken ? 'Synced with GitHub' : 'No token found in vault');
  render();
}

document.getElementById('lock-btn').addEventListener('click', () => {
  cryptoKey = null; ghToken = null; currentSha = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('lock-screen').style.display = 'flex';
  initLockScreen();
});

initLockScreen();

/* ===================== TOTP logic ===================== */
const PALETTE = ['#6f9ceb', '#d97aa8', '#7ec98f', '#e0a94f', '#9d8cf0', '#5fb8c9', '#d9836a'];
function colorFor(index) { return PALETTE[index % PALETTE.length]; }

function base32ToBytes(input) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const clean = (input || '').toUpperCase().replace(/[^A-Z2-7]/g, '');
  let bits = '';
  for (const ch of clean) {
    const val = alphabet.indexOf(ch);
    if (val === -1) continue;
    bits += val.toString(2).padStart(5, '0');
  }
  const bytes = [];
  for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
  return new Uint8Array(bytes);
}

function parseOtpAuthUrl(raw) {
  const trimmed = raw.trim();
  if (!trimmed.toLowerCase().startsWith('otpauth://')) throw new Error("Invalid otpauth:// setup URL.");
  
  try {
    const url = new URL(trimmed);
    const params = url.searchParams;
    const secret = params.get('secret');
    if (!secret) throw new Error('No secret key found in URL.');
    
    const rawLabel = decodeURIComponent(url.pathname.replace(/^\/+/, ''));
    let issuer = params.get('issuer') || '';
    let account = rawLabel;
    if (rawLabel.includes(':')) {
      const parts = rawLabel.split(':');
      if (!issuer) issuer = parts[0];
      account = parts.slice(1).join(':');
    }
    if (!issuer) issuer = account || 'Account';
    const algorithm = (params.get('algorithm') || 'SHA1').toUpperCase();
    const digits = parseInt(params.get('digits') || '6', 10);
    const period = parseInt(params.get('period') || '30', 10);
    return { secret, issuer, label: account, algorithm, digits, period };
  } catch(e) {
    if (e.message.includes('No secret')) throw e;
    throw new Error('Invalid or malformed otpauth:// URL.');
  }
}

async function hmac(algorithm, keyBytes, msgBytes) {
  const algoMap = { SHA1: 'SHA-1', SHA256: 'SHA-256', SHA512: 'SHA-512' };
  const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: algoMap[algorithm] || 'SHA-1' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, msgBytes);
  return new Uint8Array(sig);
}
function counterBytes(counter) {
  const buf = new ArrayBuffer(8);
  const view = new DataView(buf);
  view.setUint32(4, counter >>> 0, false);
  view.setUint32(0, Math.floor(counter / 0x100000000), false);
  return new Uint8Array(buf);
}
async function totp(account) {
  const period = account.period || 30;
  const digits = account.digits || 6;
  const counter = Math.floor(Date.now() / 1000 / period);
  const keyBytes = base32ToBytes(account.secret);
  if (keyBytes.length === 0) return 'INVALID';
  const msgBytes = counterBytes(counter);
  const h = await hmac(account.algorithm || 'SHA1', keyBytes, msgBytes);
  const offset = h[h.length - 1] & 0xf;
  const binCode = ((h[offset] & 0x7f) << 24) | ((h[offset + 1] & 0xff) << 16) | ((h[offset + 2] & 0xff) << 8) | (h[offset + 3] & 0xff);
  return (binCode % Math.pow(10, digits)).toString().padStart(digits, '0');
}
function timeRemaining(period = 30) {
  const now = Math.floor(Date.now() / 1000);
  return period - (now % period);
}

/* ===================== Render ===================== */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render() {
  const container = document.getElementById('cards');
  const addBtn = document.getElementById('add-account-btn');
  container.innerHTML = '';

  if (accounts.length === 0 && !showingAddForm) {
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = 'No accounts yet. Click "Add account" below to store your first key.';
    container.appendChild(empty);
  }

  accounts.forEach((acc, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--stripe', colorFor(index));
    const remaining = timeRemaining(acc.period);
    const pct = remaining / (acc.period || 30);
    const radius = 13;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference * (1 - pct);
    card.innerHTML = `
      <div class="card-top">
        <span class="service-name">${escapeHtml(acc.issuer || 'Account')}</span>
        <span class="account-label">${escapeHtml(acc.label || '')}</span>
      </div>
      <div class="code-row">
        <span class="code" data-action="copy" data-id="${acc.id}">${acc.code || '------'}</span>
        <div class="ring-wrap">
          <svg width="32" height="32" viewBox="0 0 32 32">
            <circle class="ring-bg" cx="16" cy="16" r="${radius}" />
            <circle class="ring-fg" cx="16" cy="16" r="${radius}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" />
          </svg>
          <div class="ring-label">${remaining}</div>
        </div>
      </div>
      <div class="card-actions">
        <button data-action="remove" data-id="${acc.id}">Remove</button>
        <span class="copied-tag" id="copied-${acc.id}">Copied</span>
      </div>`;
    container.appendChild(card);
  });

  if (showingAddForm) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top"><span class="service-name">Add new account</span></div>
      <div class="add-form">
        <input type="text" placeholder="Service Name (e.g., Google, GitHub)" id="new-issuer-input" />
        <input type="text" placeholder="Account Name / Email (e.g., user@gmail.com)" id="new-label-input" />
        <input type="text" placeholder="Setup Key or otpauth:// URL" id="new-secret-input" />
        
        <div class="add-form-row">
          <button data-action="save-new">Save Account</button>
          <button class="secondary" data-action="cancel-new">Cancel</button>
        </div>
        <div class="error-msg" id="new-account-error"></div>
        <div class="hint">Your key will be encrypted and saved across all connected devices automatically.</div>
      </div>`;
    container.appendChild(card);
    addBtn.style.display = 'none';
    
    const secretInput = document.getElementById('new-secret-input');
    secretInput.addEventListener('input', () => {
      const raw = secretInput.value.trim();
      if (raw.toLowerCase().startsWith('otpauth://')) {
        try {
          const parsed = parseOtpAuthUrl(raw);
          const issuerEl = document.getElementById('new-issuer-input');
          const labelEl = document.getElementById('new-label-input');
          if (parsed.issuer && issuerEl) issuerEl.value = parsed.issuer;
          if (parsed.label && labelEl) labelEl.value = parsed.label;
        } catch(e) {}
      }
    });

    setTimeout(() => document.getElementById('new-issuer-input')?.focus(), 0);
  } else {
    addBtn.style.display = 'flex';
  }

  wireEvents(container);
}

function wireEvents(container) {
  container.querySelectorAll('[data-action="remove"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      accounts = accounts.filter(a => a.id !== btn.dataset.id);
      await saveAccountsAndSync();
      render();
    });
  });

  container.querySelectorAll('[data-action="copy"]').forEach(el => {
    el.addEventListener('click', () => {
      const acc = accounts.find(a => a.id === el.dataset.id);
      if (!acc || !acc.code || acc.code === 'ERROR') return;
      navigator.clipboard.writeText(acc.code).then(() => {
        const tag = document.getElementById(`copied-${acc.id}`);
        if (tag) { tag.classList.add('show'); setTimeout(() => tag.classList.remove('show'), 1200); }
      });
    });
  });

  const saveBtn = container.querySelector('[data-action="save-new"]');
  if (saveBtn) {
    saveBtn.addEventListener('click', async () => {
      const issuerInput = document.getElementById('new-issuer-input');
      const labelInput = document.getElementById('new-label-input');
      const secretInput = document.getElementById('new-secret-input');
      const errEl = document.getElementById('new-account-error');
      
      const rawSecret = secretInput.value.trim();
      const customIssuer = issuerInput.value.trim();
      const customLabel = labelInput.value.trim();

      try {
        let parsed = { algorithm: 'SHA1', digits: 6, period: 30 };
        
        if (rawSecret.toLowerCase().startsWith('otpauth://')) {
          parsed = parseOtpAuthUrl(rawSecret);
        } else {
          if (!rawSecret) throw new Error('Setup key or URL is required.');
          parsed.secret = rawSecret;
        }

        // Sanitize secret key: strip spaces, dashes, and ensure uppercase
        parsed.secret = parsed.secret.toUpperCase().replace(/[\s-]/g, '');

        parsed.issuer = customIssuer || parsed.issuer || 'Account';
        parsed.label = customLabel || parsed.label || '';
        parsed.id = 'acc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);

        accounts.push(parsed);
        showingAddForm = false;
        await refreshCode(parsed.id);
        await saveAccountsAndSync();
        render();
      } catch (e) {
        errEl.textContent = e.message;
      }
    });
  }

  const cancelBtn = container.querySelector('[data-action="cancel-new"]');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { showingAddForm = false; render(); });
}

document.getElementById('add-account-btn').addEventListener('click', () => { showingAddForm = true; render(); });

async function refreshCode(id) {
  const acc = accounts.find(a => a.id === id);
  if (!acc) return;
  try {
    acc.code = await totp(acc);
  } catch (e) {
    console.error(`Failed generating TOTP for ${acc.issuer}:`, e);
    acc.code = 'ERROR';
  }
}

async function tick() {
  if (!cryptoKey || accounts.length === 0) return;
  let needsRender = false;
  for (const acc of accounts) {
    const remaining = timeRemaining(acc.period);
    if (remaining === (acc.period || 30) || !acc.code) { await refreshCode(acc.id); needsRender = true; }
  }
  if (needsRender) {
    render();
  } else {
    document.querySelectorAll('.ring-wrap').forEach((wrap, idx) => {
      const acc = accounts[idx];
      if (!acc) return;
      const remaining = timeRemaining(acc.period);
      const pct = remaining / (acc.period || 30);
      const radius = 13;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference * (1 - pct);
      const fg = wrap.querySelector('.ring-fg');
      const label = wrap.querySelector('.ring-label');
      if (fg) fg.setAttribute('stroke-dashoffset', offset);
      if (label) label.textContent = remaining;
    });
  }
}
setInterval(tick, 1000);
</script>
