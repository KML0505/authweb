<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b; --surface: #17171a; --border: #2a2a2e;
    --text: #f0efec; --text-dim: #85858c; --accent: #e8a33d; --danger: #c2665f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 380px; margin: 0 auto; padding: 48px 20px 80px; }

  #lock-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lock-box { width: 100%; max-width: 320px; text-align: center; }
  .lock-box h2 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  .lock-box p { font-size: 13px; color: var(--text-dim); margin: 0 0 20px; line-height: 1.4; }
  .lock-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; color: var(--text); font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; text-align: center; margin-bottom: 10px;
  }
  .lock-box input:focus { outline: none; border-color: var(--accent); }
  .lock-box button {
    width: 100%; background: var(--accent); color: #1a1206; border: none; border-radius: 8px;
    padding: 11px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  .lock-box button.secondary { background: none; border: 1px solid var(--border); color: var(--text-dim); margin-top: 8px; }
  .lock-box button.secondary:hover { color: var(--text); }
  .lock-error { font-size: 12px; color: var(--danger); margin-top: 10px; min-height: 16px; }

  #output-box { display: none; text-align: left; margin-top: 16px; }
  #output-box textarea {
    width: 100%; height: 110px; background: #111113; border: 1px solid var(--border);
    color: var(--accent); font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 10px; border-radius: 6px; resize: none; word-break: break-all;
  }
  .instructions { font-size: 11.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.4; text-align: left; }

  #app { display: none; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; }
  header button { background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 12px; }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .service { font-size: 14px; font-weight: 600; }
  .code-row { display: flex; align-items: center; justify-content: space-between; }
  .code { font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 500; letter-spacing: 0.08em; cursor: pointer; }

  .ring-wrap { position: relative; width: 32px; height: 32px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 3; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .toast { font-size: 11px; color: var(--accent); margin-top: 6px; opacity: 0; transition: opacity 0.2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box" id="mode-unlock">
    <h2>Unlock Vault</h2>
    <p>Enter your master password to decrypt 2FA codes.</p>
    <input type="password" id="unlock-pass" placeholder="Master Password" autocomplete="off" />
    <button id="unlock-btn">Unlock</button>
    <div class="lock-error" id="unlock-error"></div>
    <button class="secondary" id="go-setup-btn">Re-configure / Setup Vault</button>
  </div>

  <div class="lock-box" id="mode-setup" style="display: none;">
    <h2>Setup Encrypted Vault</h2>
    <p>Create your password and enter your Base32 seed keys to generate a public-safe payload.</p>
    <input type="password" id="setup-pass" placeholder="Master Password" autocomplete="off" />
    <input type="text" id="setup-google" placeholder="Google Base32 Secret" autocomplete="off" />
    <input type="text" id="setup-github" placeholder="GitHub Base32 Secret" autocomplete="off" />
    <button id="generate-btn">Encrypt Payload</button>
    <div class="lock-error" id="setup-error"></div>
    
    <div id="output-box">
      <div class="instructions">Copy the generated code below and replace <code>ENCRYPTED_VAULT</code> in line 118 of this file:</div>
      <textarea id="payload-output" readonly></textarea>
      <button class="secondary" id="back-unlock-btn">Return to Unlock</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="wrap">
    <header>
      <h1>Codes</h1>
      <button id="lock-btn">Lock</button>
    </header>
    <div id="cards"></div>
  </div>
</div>

<script>
/* =========================================================================
   1. SAFE PUBLIC ENCRYPTED PAYLOAD
   (Paste your generated output object here)
   ========================================================================= */
/* Example format once generated:
const ENCRYPTED_VAULT = {
  "salt": "...",
  "iv": "...",
  "ciphertext": "..."
};
*/
const ENCRYPTED_VAULT = {
  "salt": "2IBgar3Q+W2EwkOxmhsHGw==",
  "iv": "JAEE1GhvsKgr5mHK",
  "ciphertext": "ozkO/RS+JAnGCq0S6Z2gCwIW5uuO2pJ00p5QGsON0UMrpvjL2B2JKHj5dds6dXX3IqoqcJEpMrA1kZn+6ZtDn8N+B3uxgdor4EufsALMYy4iYhzXBZ0CtJCW5mj1Nuvh4lEwpL3PurfvwkF5gNdntMl3YaF8yXjkWtoQt8U8nku6mD/aXMPuk4GECeE+UwhCg/T01yfpVph0twQRdsA="
};
let decryptedSecrets = null;

/* =========================================================================
   2. CRYPTO UTILITIES (PBKDF2 + AES-GCM + TOTP)
   ========================================================================= */
function b64ToBuf(b64) {
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
}

function bufToB64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}

async function deriveKey(password, salt) {
  const enc = new TextEncoder().encode(password);
  const baseKey = await crypto.subtle.importKey('raw', enc, 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function decryptVault(password) {
  if (!ENCRYPTED_VAULT) return null;
  try {
    const salt = b64ToBuf(ENCRYPTED_VAULT.salt);
    const iv = b64ToBuf(ENCRYPTED_VAULT.iv);
    const ct = b64ToBuf(ENCRYPTED_VAULT.ciphertext);

    const key = await deriveKey(password, salt);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const parsed = JSON.parse(new TextDecoder().decode(plainBuf));

    if (parsed.canary !== 'VALID_VAULT_v1') return null;
    return parsed;
  } catch (e) {
    return null; // Decryption failed (Wrong password)
  }
}

async function encryptPayload(password, googleSecret, githubSecret) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);

  const payload = JSON.stringify({
    canary: 'VALID_VAULT_v1',
    google: googleSecret.toUpperCase().replace(/[^A-Z2-7]/g, ''),
    github: githubSecret.toUpperCase().replace(/[^A-Z2-7]/g, '')
  });

  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(payload));

  return {
    salt: bufToB64(salt),
    iv: bufToB64(iv),
    ciphertext: bufToB64(ct)
  };
}

function base32ToBytes(input) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const clean = input.toUpperCase().replace(/[^A-Z2-7]/g, '');
  let bits = '';
  for (const ch of clean) {
    const val = alphabet.indexOf(ch);
    if (val !== -1) bits += val.toString(2).padStart(5, '0');
  }
  const bytes = [];
  for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
  return new Uint8Array(bytes);
}

async function getTotpCode(secret) {
  const counter = Math.floor(Date.now() / 1000 / 30);
  const buf = new ArrayBuffer(8);
  const view = new DataView(buf);
  view.setUint32(4, counter, false);
  
  const keyBytes = base32ToBytes(secret);
  const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, new Uint8Array(buf));
  const h = new Uint8Array(sig);

  const offset = h[h.length - 1] & 0xf;
  const bin = ((h[offset] & 0x7f) << 24) | ((h[offset + 1] & 0xff) << 16) | ((h[offset + 2] & 0xff) << 8) | (h[offset + 3] & 0xff);
  return (bin % 1000000).toString().padStart(6, '0');
}

/* =========================================================================
   3. UI & VIEW CONTROLLERS
   ========================================================================= */
const modeUnlock = document.getElementById('mode-unlock');
const modeSetup = document.getElementById('mode-setup');

if (!ENCRYPTED_VAULT) {
  modeUnlock.style.display = 'none';
  modeSetup.style.display = 'block';
}

document.getElementById('go-setup-btn').addEventListener('click', () => {
  modeUnlock.style.display = 'none';
  modeSetup.style.display = 'block';
});

document.getElementById('back-unlock-btn').addEventListener('click', () => {
  modeSetup.style.display = 'none';
  modeUnlock.style.display = 'block';
});

document.getElementById('generate-btn').addEventListener('click', async () => {
  const pass = document.getElementById('setup-pass').value;
  const google = document.getElementById('setup-google').value.trim();
  const github = document.getElementById('setup-github').value.trim();
  const errEl = document.getElementById('setup-error');
  
  errEl.textContent = '';
  if (!pass || !google || !github) {
    errEl.textContent = 'All fields are required.';
    return;
  }

  const result = await encryptPayload(pass, google, github);
  document.getElementById('payload-output').value = `const ENCRYPTED_VAULT = ${JSON.stringify(result, null, 2)};`;
  document.getElementById('output-box').style.display = 'block';
});

document.getElementById('unlock-btn').addEventListener('click', unlock);
document.getElementById('unlock-pass').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('lock-btn').addEventListener('click', lock);

async function unlock() {
  const pass = document.getElementById('unlock-pass').value;
  const errorEl = document.getElementById('unlock-error');
  errorEl.textContent = '';
  
  if (!pass) return;

  const data = await decryptVault(pass);
  if (!data) {
    errorEl.textContent = 'Incorrect password or invalid vault.';
    return;
  }

  decryptedSecrets = [
    { id: 'google', name: 'Google', secret: data.google },
    { id: 'github', name: 'GitHub', secret: data.github }
  ];

  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
}

function lock() {
  decryptedSecrets = null;
  document.getElementById('unlock-pass').value = '';
  document.getElementById('unlock-error').textContent = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('lock-screen').style.display = 'flex';
}

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';

  decryptedSecrets.forEach(acc => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <span class="service">${acc.name}</span>
      </div>
      <div class="code-row">
        <span class="code" id="code-${acc.id}">------</span>
        <div class="ring-wrap">
          <svg width="32" height="32" viewBox="0 0 32 32">
            <circle class="ring-bg" cx="16" cy="16" r="13" />
            <circle class="ring-fg" id="ring-${acc.id}" cx="16" cy="16" r="13" stroke-dasharray="81.68" stroke-dashoffset="0" />
          </svg>
          <div class="ring-label" id="timer-${acc.id}">30</div>
        </div>
      </div>
      <div class="toast" id="toast-${acc.id}">Copied code</div>
    `;
    
    card.querySelector('.code').addEventListener('click', () => {
      const code = document.getElementById(`code-${acc.id}`).textContent;
      if (code !== '------') {
        navigator.clipboard.writeText(code);
        const toast = document.getElementById(`toast-${acc.id}`);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1200);
      }
    });

    container.appendChild(card);
  });

  updateCodes();
}

async function updateCodes() {
  if (!decryptedSecrets) return;
  
  const secondsLeft = 30 - (Math.floor(Date.now() / 1000) % 30);
  const pct = secondsLeft / 30;
  const offset = 81.68 * (1 - pct);

  for (const acc of decryptedSecrets) {
    const codeEl = document.getElementById(`code-${acc.id}`);
    const ringEl = document.getElementById(`ring-${acc.id}`);
    const timerEl = document.getElementById(`timer-${acc.id}`);

    if (codeEl) {
      if (secondsLeft === 30 || codeEl.textContent === '------') {
        codeEl.textContent = await getTotpCode(acc.secret);
      }
      ringEl.style.strokeDashoffset = offset;
      timerEl.textContent = secondsLeft;
    }
  }
}

setInterval(updateCodes, 1000);
</script>
</body>
</html>
