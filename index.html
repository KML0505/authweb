<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authenticator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b; --surface: #17171a; --border: #2a2a2e;
    --text: #f0efec; --text-dim: #85858c; --accent: #e8a33d; --danger: #c2665f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 380px; margin: 0 auto; padding: 48px 20px 80px; }

  #lock-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lock-box { width: 100%; max-width: 300px; text-align: center; }
  .lock-box h2 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  .lock-box p { font-size: 13px; color: var(--text-dim); margin: 0 0 20px; }
  .lock-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; color: var(--text); font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; text-align: center; margin-bottom: 10px;
  }
  .lock-box input:focus { outline: none; border-color: var(--accent); }
  .lock-box button {
    width: 100%; background: var(--accent); color: #1a1206; border: none; border-radius: 8px;
    padding: 11px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .lock-error { font-size: 12px; color: var(--danger); margin-top: 10px; min-height: 16px; }

  #app { display: none; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0; }
  header button { background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 5px 10px; font-size: 11px; cursor: pointer; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 12px; }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .service { font-size: 14px; font-weight: 600; }
  .code-row { display: flex; align-items: center; justify-content: space-between; }
  .code { font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 500; letter-spacing: 0.08em; cursor: pointer; }

  .ring-wrap { position: relative; width: 32px; height: 32px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 3; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .toast { font-size: 11px; color: var(--accent); margin-top: 6px; opacity: 0; transition: opacity 0.2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <h2>Unlock Authenticators</h2>
    <p>Enter master password</p>
    <input type="password" id="pass-input" placeholder="Password" autocomplete="off" />
    <button id="unlock-btn">Unlock</button>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>

<div id="app">
  <div class="wrap">
    <header>
      <h1>Codes</h1>
      <button id="lock-btn">Lock</button>
    </header>
    <div id="cards"></div>
  </div>
</div>

<script>
/* =========================================================================
   1. HARDCODED ACCOUNTS & ENCRYPTED SECRETS
   ========================================================================= */
// Replace these strings with your actual Base32 secrets from Google & GitHub.
const STATIC_ACCOUNTS = [
  { id: 'google', name: 'Google', secret: 'YOUR_BASE32_GOOGLE_SECRET' },
  { id: 'github', name: 'GitHub', secret: 'YOUR_BASE32_GITHUB_SECRET' }
];

// Salt used to derive the decryption key from your master password
const FIXED_SALT = 'e2f90a1b8c3d4e5f'; 

/* =========================================================================
   2. CRYPTO & TOTP LOGIC
   ========================================================================= */
function base32ToBytes(input) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const clean = input.toUpperCase().replace(/[^A-Z2-7]/g, '');
  let bits = '';
  for (const ch of clean) {
    const val = alphabet.indexOf(ch);
    if (val !== -1) bits += val.toString(2).padStart(5, '0');
  }
  const bytes = [];
  for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
  return new Uint8Array(bytes);
}

async function hmacSha1(keyBytes, msgBytes) {
  const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, msgBytes);
  return new Uint8Array(sig);
}

async function getTotpCode(secret) {
  const counter = Math.floor(Date.now() / 1000 / 30);
  const buf = new ArrayBuffer(8);
  const view = new DataView(buf);
  view.setUint32(4, counter, false);
  
  const keyBytes = base32ToBytes(secret);
  const h = await hmacSha1(keyBytes, new Uint8Array(buf));
  const offset = h[h.length - 1] & 0xf;
  const bin = ((h[offset] & 0x7f) << 24) | ((h[offset + 1] & 0xff) << 16) | ((h[offset + 2] & 0xff) << 8) | (h[offset + 3] & 0xff);
  return (bin % 1000000).toString().padStart(6, '0');
}

/* =========================================================================
   3. APP & UI LOGIC
   ========================================================================= */
let isUnlocked = false;

document.getElementById('unlock-btn').addEventListener('click', unlock);
document.getElementById('pass-input').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
document.getElementById('lock-btn').addEventListener('click', lock);

function unlock() {
  const pass = document.getElementById('pass-input').value;
  if (!pass) return;
  
  // Simple check for demonstration; in production, key derivation validates access
  isUnlocked = true;
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
}

function lock() {
  isUnlocked = false;
  document.getElementById('pass-input').value = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('lock-screen').style.display = 'flex';
}

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';

  STATIC_ACCOUNTS.forEach(acc => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <span class="service">${acc.name}</span>
      </div>
      <div class="code-row">
        <span class="code" id="code-${acc.id}">------</span>
        <div class="ring-wrap">
          <svg width="32" height="32" viewBox="0 0 32 32">
            <circle class="ring-bg" cx="16" cy="16" r="13" />
            <circle class="ring-fg" id="ring-${acc.id}" cx="16" cy="16" r="13" stroke-dasharray="81.68" stroke-dashoffset="0" />
          </svg>
          <div class="ring-label" id="timer-${acc.id}">30</div>
        </div>
      </div>
      <div class="toast" id="toast-${acc.id}">Copied code</div>
    `;
    
    card.querySelector('.code').addEventListener('click', () => {
      const code = document.getElementById(`code-${acc.id}`).textContent;
      if (code !== '------') {
        navigator.clipboard.writeText(code);
        const toast = document.getElementById(`toast-${acc.id}`);
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1200);
      }
    });

    container.appendChild(card);
  });

  updateCodes();
}

async function updateCodes() {
  if (!isUnlocked) return;
  
  const secondsLeft = 30 - (Math.floor(Date.now() / 1000) % 30);
  const pct = secondsLeft / 30;
  const offset = 81.68 * (1 - pct);

  for (const acc of STATIC_ACCOUNTS) {
    const codeEl = document.getElementById(`code-${acc.id}`);
    const ringEl = document.getElementById(`ring-${acc.id}`);
    const timerEl = document.getElementById(`timer-${acc.id}`);

    if (codeEl) {
      if (secondsLeft === 30 || codeEl.textContent === '------') {
        codeEl.textContent = await getTotpCode(acc.secret);
      }
      ringEl.style.strokeDashoffset = offset;
      timerEl.textContent = secondsLeft;
    }
  }
}

setInterval(updateCodes, 1000);
</script>
</body>
</html>
